        body { 
            font-family: 'Times New Roman', Times, serif;

        h1 {

        /* MAIN MENU */ 
        .menu { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
             
           
        } 
 
        /* MENU ITEMS */ 
        .menu-item { 
            position: relative; 
        } 
 
        .menu a { 
            display: block; 
            background-color: #009de6; 
            color: rgb(231, 221, 221); 
            padding: 12px 20px; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: 0.3s ease; 
        } 
 
        /* HOVER EFFECT */ 
        .menu a:hover { 
            background-color: #81dfda; 
            color: #222; 
            transform: translateY(-5px); 
            box-shadow: 0 0 10px #66148b, 
                        0 0 25px #0ff; 
        } 
 
        /* SUBMENU */ 
        .submenu { 
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 0; 
            min-width: 160px; 
            background-color: hsl(220, 9%, 94%); 
            padding: 8px; 
            border-radius: 8px; 
            z-index: 10; 
        } 
 
        /* SHOW SUBMENU WHEN HOVERED */ 
        .menu-item:hover .submenu { 
            display: block; 
        } 
 
        /* SUBMENU LINKS */ 
        .submenu a { 
            background-color: #00060e; 
            margin: 5px 0; 
            border-radius: 5px; 
        } 
 
        .submenu a:hover { 
            background-color: #2ce5ad; 
            transform: translateX(5px); 
        } 
 
    </style> 
</head>
