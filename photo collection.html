<style>
    <style>

        .main {
margin: 50px auto;
display: grid;
grid-template-columns: repeat(3, 200px);
gap: 20px;
}
img {
width: 200px;
height: 200px;
border-radius: 10px;
box-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
}
.main:hover > :not(:hover) {
filter: blur(5px);
opacity: 0.5;
}

 /* 1. CRITICAL: Remove default browser space */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* 2. Full-screen fixed container */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111; /* dark fallback color */
            z-index: 99999;           /* forces it to stay on top */
            overflow: hidden;
        }

        /* 3. Forces the image to fill the screen perfectly */
        #loading-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Styling for your actual website content */
        #main-content {
            padding: 40px;
            font-family: sans-serif;
        }
