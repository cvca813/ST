<style> 
 
    body { 
        font-family: Arial; 
        text-align: center; 
        background-color: rgb(0, 0, 0); 
    } 
 
    h1 { 
        color: darkblue; 
    } 
 
    img { 
        width: 500px; 
        height: 300px; 
        border: 5px solid white; 
        border-radius: 15px; 
 
        /* Smooth effect */ 
        transition: 0.5s; 
 
        /* Default filter */ 
        filter: none; 
    } 
 
    /* Zoom when hovering */ 
    img:hover { 
        transform: scale(1.05); 
    } 
 
    button { 
        padding: 10px 20px; 
        margin: 5px; 
        cursor: pointer; 
        background-color: navy; 
        color: white; 
        border: none; 
        border-radius: 5px; 
    } 
 
    button:hover { 
        background-color: orange; 
    } 
 
</style> 
 
</head>
